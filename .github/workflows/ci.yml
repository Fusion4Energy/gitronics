name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    rust:
        name: Rust tests (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Set up Python (Required for PyO3 test linking)
              id: setup-python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Configure PyO3 Python path
              shell: bash
              run: |
                  echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> $GITHUB_ENV
                  if [[ "$RUNNER_OS" == "macOS" ]]; then
                    PYLIB=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
                    PYVER=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LDVERSION'))")
                    echo "RUSTFLAGS=-L${PYLIB} -lpython${PYVER}" >> $GITHUB_ENV
                  fi

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: rustfmt
              run: cargo fmt --all --check

            - name: Test
              run: cargo test --workspace --features pyo3/auto-initialize

            - name: Clippy
              run: cargo clippy --workspace -- -D warnings

    viewer:
        name: Viewer (single-file build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: viewer/package-lock.json

            - name: Install dependencies
              working-directory: viewer
              run: npm ci

            - name: Type-check
              working-directory: viewer
              run: npm run check

            - name: Build the single-file viewer
              working-directory: viewer
              run: npm run build

            # The viewer is committed as src/project_report.html so the Rust build
            # stays Node-free. Fail if a rebuild changes it — i.e. a contributor
            # edited viewer/ without committing the regenerated artifact.
            - name: Verify committed artifact is up to date
              run: git diff --exit-code -- src/project_report.html

    ruff:
        name: Python lint (ruff)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5

            # Pinned so a new ruff release can't fail CI unexpectedly; bump deliberately.
            - name: ruff lint
              run: uvx ruff@0.15.21 check python

            - name: ruff format
              run: uvx ruff@0.15.21 format --check python

    python:
        name: Python tests (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Install maturin and pytest
              run: pip install maturin pytest

            - name: Build and install Python package (dev mode)
              run: pip install -e .

            - name: Run Python tests
              run: pytest
