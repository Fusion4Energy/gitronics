<svg width="240" height="240" viewBox="0 0 240 240" role="img"
     aria-label="Gitronics logo — a radiation trefoil whose lower-left blade is a Git commit graph"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD173"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- two solid radiation blades + central hub -->
  <g fill="url(#blade)">
    <path transform="translate(120,120)" d="M -20 -34.64 L -54 -93.53 A 108 108 0 0 1 54 -93.53 L 20 -34.64 A 40 40 0 0 0 -20 -34.64 Z"/>
    <path transform="translate(120,120) rotate(120)" d="M -20 -34.64 L -54 -93.53 A 108 108 0 0 1 54 -93.53 L 20 -34.64 A 40 40 0 0 0 -20 -34.64 Z"/>
  </g>
  <circle cx="120" cy="120" r="26" fill="#16325E"/>

  <!-- lower-left blade rendered as a Git commit graph, symmetric about the 150-degree blade axis -->
  <g stroke="#16325E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 75 146 L 61 201 L 20 131 Z"/>
  </g>
  <g fill="#16325E">
    <circle cx="75" cy="146" r="14"/>
    <circle cx="61" cy="201" r="14"/>
    <circle cx="20" cy="131" r="14"/>
  </g>
</svg>
