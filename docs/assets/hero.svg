<svg width="100%" viewBox="0 0 1200 500" role="img"
     aria-label="Gitronics — assemble MCNP neutronics models from modular, version-controlled components"
     xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="26%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#16202F"/>
      <stop offset="100%" stop-color="#0B0E15"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD173"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="500" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="498" rx="23" fill="none" stroke="#1C2634" stroke-width="1.5"/>

  <!-- LEFT: lockup (logo mark + wordmark) -->
  <g transform="translate(53.6,67.6) scale(0.42)">
    <g fill="url(#amber)">
      <path transform="translate(120,120)" d="M -20 -34.64 L -54 -93.53 A 108 108 0 0 1 54 -93.53 L 20 -34.64 A 40 40 0 0 0 -20 -34.64 Z"/>
      <path transform="translate(120,120) rotate(120)" d="M -20 -34.64 L -54 -93.53 A 108 108 0 0 1 54 -93.53 L 20 -34.64 A 40 40 0 0 0 -20 -34.64 Z"/>
    </g>
    <g stroke="url(#amber)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 75 146 L 61 201 L 20 131 Z"/>
      <path d="M 75 146 L 120 120"/>
    </g>
    <g fill="url(#amber)">
      <circle cx="75" cy="146" r="14"/>
      <circle cx="61" cy="201" r="14"/>
      <circle cx="20" cy="131" r="14"/>
    </g>
    <circle cx="120" cy="120" r="26" fill="url(#amber)"/>
  </g>

  <text x="176" y="130" fill="#F4F6FB" font-size="60" font-weight="800" letter-spacing="-1">Gitronics</text>
  <text x="179" y="162" fill="#FFC24B" font-size="14" font-weight="700" letter-spacing="4">MCNP &#183; NEUTRONICS &#183; FUSION</text>

  <text x="66" y="214" fill="#C7D0DD" font-size="22">Assemble MCNP neutronics models from modular,</text>
  <text x="66" y="244" fill="#C7D0DD" font-size="22">version-controlled components &#8212; not one big file.</text>

  <!-- metadata chips -->
  <g font-size="14" font-weight="600">
    <rect x="66" y="278" width="130" height="34" rx="17" fill="#121A27" stroke="#26313F"/>
    <text x="131" y="300" fill="#B9C3D1" text-anchor="middle">Rust + Python</text>
    <rect x="206" y="278" width="104" height="34" rx="17" fill="#121A27" stroke="#26313F"/>
    <text x="258" y="300" fill="#B9C3D1" text-anchor="middle">EUPL-1.2</text>
    <rect x="320" y="278" width="120" height="34" rx="17" fill="#121A27" stroke="#26313F"/>
    <text x="380" y="300" fill="#B9C3D1" text-anchor="middle">Python &#8805; 3.9</text>
  </g>

  <!-- proof line -->
  <g>
    <circle cx="74" cy="348" r="4" fill="#38D9C0"/>
    <text x="88" y="353" fill="#8FE7DA" font-size="15" font-weight="600">Trusted on the ITER and JT-60SA neutronics models</text>
  </g>

  <!-- command chip -->
  <rect x="66" y="378" width="556" height="52" rx="12" fill="#0E1622" stroke="#26313F"/>
  <text x="86" y="410" fill="#FFC24B" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$</text>
  <text x="106" y="410" fill="#DDE4EE" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gitronics build configurations/baseline.yaml</text>

  <!-- RIGHT: modular assembly schematic -->
  <g font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="724" y="84" width="150" height="34" rx="8" fill="#141D2B" stroke="#2C3849"/>
    <text x="799" y="106" fill="#C7D0DD" text-anchor="middle">fillers/*.mcnp</text>
    <rect x="888" y="84" width="118" height="34" rx="8" fill="#141D2B" stroke="#2C3849"/>
    <text x="947" y="106" fill="#C7D0DD" text-anchor="middle">materials</text>
    <rect x="1020" y="84" width="96" height="34" rx="8" fill="#141D2B" stroke="#2C3849"/>
    <text x="1068" y="106" fill="#C7D0DD" text-anchor="middle">source</text>
  </g>
  <g stroke="#3A4657" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
    <path d="M 799 118 L 799 146"/>
    <path d="M 947 118 L 947 146"/>
    <path d="M 1068 118 L 1068 146"/>
  </g>
  <g fill="#3A4657">
    <path d="M 795 144 L 803 144 L 799 150 Z"/>
    <path d="M 943 144 L 951 144 L 947 150 Z"/>
    <path d="M 1064 144 L 1072 144 L 1068 150 Z"/>
  </g>

  <!-- assembled model card -->
  <rect x="712" y="150" width="418" height="268" rx="18" fill="#0E1622" stroke="#293646"/>
  <circle cx="734" cy="180" r="5" fill="#FFC24B"/>
  <text x="748" y="185" fill="#8A97A8" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MODEL / assembled.mcnp</text>
  <line x1="734" y1="200" x2="1108" y2="200" stroke="#1E2836"/>

  <!-- envelope cell grid: 4 x 3 -->
  <g>
    <rect x="736" y="220" width="82" height="48" rx="7" fill="url(#amber)"/>
    <rect x="832" y="220" width="82" height="48" rx="7" fill="#131C2A" stroke="#2A3646"/>
    <rect x="928" y="220" width="82" height="48" rx="7" fill="#131C2A" stroke="#2A3646"/>
    <rect x="1024" y="220" width="82" height="48" rx="7" fill="url(#amber)"/>
    <rect x="736" y="282" width="82" height="48" rx="7" fill="#131C2A" stroke="#2A3646"/>
    <rect x="832" y="282" width="82" height="48" rx="7" fill="#131C2A" stroke="#2A3646"/>
    <rect x="928" y="282" width="82" height="48" rx="7" fill="url(#amber)"/>
    <rect x="1024" y="282" width="82" height="48" rx="7" fill="#131C2A" stroke="#2A3646"/>
    <rect x="736" y="344" width="82" height="48" rx="7" fill="#131C2A" stroke="#2A3646"/>
    <rect x="832" y="344" width="82" height="48" rx="7" fill="url(#amber)"/>
    <rect x="928" y="344" width="82" height="48" rx="7" fill="#131C2A" stroke="#2A3646"/>
    <rect x="1024" y="344" width="82" height="48" rx="7" fill="#131C2A" stroke="#2A3646"/>
  </g>

  <!-- git commit lineage under the card -->
  <g>
    <line x1="736" y1="452" x2="1078" y2="452" stroke="#2C3849" stroke-width="2"/>
    <path d="M 900 452 q 24 0 24 -20" fill="none" stroke="#2C3849" stroke-width="2"/>
    <circle cx="760" cy="452" r="7" fill="#0E1622" stroke="#4A5768" stroke-width="2"/>
    <circle cx="840" cy="452" r="7" fill="#0E1622" stroke="#4A5768" stroke-width="2"/>
    <circle cx="924" cy="432" r="6" fill="#0E1622" stroke="#38D9C0" stroke-width="2"/>
    <circle cx="980" cy="452" r="7" fill="#0E1622" stroke="#4A5768" stroke-width="2"/>
    <circle cx="1060" cy="452" r="8" fill="url(#amber)"/>
    <text x="1078" y="457" fill="#8A97A8" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">main</text>
  </g>
</svg>
